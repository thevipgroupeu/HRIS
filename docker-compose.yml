# Development Compose stack for Horilla HR.
# Zero-config: `make dev` / `docker compose up --build`
# Production: `make prod` (uses docker-compose.prod.yml + .env — see .env.dist)
#
# Dev secrets below are intentionally weak and for local use only.
# Replaces the legacy docker-compose.yaml (Python 3.10 / runserver) stack.

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - media:/app/media
      - verification_private_media:/app/verification-private-media
      - acceptance_private_media:/app/acceptance-private-media
      - erasmus_document_private_media:/app/erasmus-document-private-media
      - onboarding_private_media:/app/onboarding-private-media
      - reporting_private_media:/app/reporting-private-media
      - offboarding_private_media:/app/offboarding-private-media
    environment:
      - DEBUG=1
      - DB_HOST=db
      # nginx is the single proxy hop; lets django-axes read the real client IP
      - AXES_PROXY_COUNT=1
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,web
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      - DATABASE_URL=postgres://horilla_user:horilla_pass@db:5432/horilla_db
      - DB_INIT_PASSWORD=dev-init-password-change-in-production
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
      - TVG_LEGAL_EMPLOYER_ID=1
      - CAREERHUB_INTERNAL_API_TOKEN=dev-careerhub-internal-token-change-in-production
      - CAREERHUB_IDENTITY_API_TOKEN=dev-careerhub-identity-token-change-in-production
      - CAREERHUB_APPLICATION_API_TOKEN=dev-careerhub-application-token-change-in-production
      - CAREERHUB_VERIFICATION_API_TOKEN=dev-careerhub-verification-token-change-in-production
      - CAREERHUB_INTERVIEW_API_TOKEN=dev-careerhub-interview-token-change-in-production
      - CAREERHUB_ARRANGEMENT_API_TOKEN=dev-careerhub-arrangement-token-change-in-production
      - TVG_VERIFICATION_PRIVATE_MEDIA_ROOT=/app/verification-private-media
      - TVG_ACCEPTANCE_PRIVATE_MEDIA_ROOT=/app/acceptance-private-media
      - TVG_ERASMUS_DOCUMENT_PRIVATE_MEDIA_ROOT=/app/erasmus-document-private-media
      - TVG_ONBOARDING_PRIVATE_MEDIA_ROOT=/app/onboarding-private-media
      - TVG_REPORTING_PRIVATE_MEDIA_ROOT=/app/reporting-private-media
      - TVG_OFFBOARDING_PRIVATE_MEDIA_ROOT=/app/offboarding-private-media
      # Disabled development default: no request can leave the container.
      - TVG_AUTOMATION_ENABLED=0
      - TVG_AUTOMATION_ENVIRONMENT=development
      - TVG_AUTOMATION_TRANSPORT_BACKEND=tvg_automation.transport.DisabledActivepiecesTransport
      - TVG_TRAINING_PROVIDER=disabled
      - TVG_TRAINING_ACTIVEPIECES_BACKEND=tvg_training.integrations.DisabledTrainingProvider
      - TVG_ANALYTICS_EXPORT_PROVIDER=disabled
      - TVG_ANALYTICS_MIN_CELL_SIZE=5
      - TVG_RECRUITMENT_FROM_EMAIL=recruitment@thevipgroup.eu
      - TVG_RECRUITMENT_REPLY_TO=recruitment@thevipgroup.eu
      - TVG_REPORTING_AI_PROVIDER=disabled
      - TVG_ONBOARDING_ZOHO_BACKEND=tvg_onboarding.integrations.DisabledProvisioningProvider
      - TVG_ONBOARDING_SELF_HOSTED_BACKEND=tvg_onboarding.integrations.DisabledProvisioningProvider
      - TVG_ERASMUS_SELF_HOSTED_SIGNING_BACKEND=tvg_erasmus.signing.DisabledSigningProvider
      - TVG_ERASMUS_NA10_BACKEND=tvg_erasmus.integrations.DisabledExternalRequirementProvider
      - TVG_VERIFICATION_SCANNER_BACKEND=tvg_erasmus.scanning.DisabledScanner
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 30s
      start_period: 60s
      retries: 3

  # Public CareerHub. It uses a separate settings module, root URLconf,
  # credential database and rate-limit cache. No Horilla admin, staff, broad
  # API, media, or HR database routes are mounted.
  careerhub:
    build: .
    entrypoint: []
    command: gunicorn horilla.careerhub_wsgi:application --config docker/gunicorn.conf.py
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles:ro
      - careerhub_private_media:/app/careerhub-private-media
    environment:
      - DEBUG=1
      - HORILLA_ENV=development
      - CAREERHUB_SECRET_KEY=careerhub-dev-key-change-in-production
      - CAREERHUB_ALLOWED_HOSTS=localhost,127.0.0.1,career.thevipgroup.eu
      - CAREERHUB_CSRF_TRUSTED_ORIGINS=http://localhost:8001,http://127.0.0.1:8001
      - CAREERHUB_PUBLIC_BASE_URL=http://localhost:8001
      - CAREERHUB_PEOPLEOPS_API_URL=http://web:8000/internal/careerhub/v1
      - CAREERHUB_INTERNAL_API_TOKEN=dev-careerhub-internal-token-change-in-production
      - CAREERHUB_IDENTITY_API_TOKEN=dev-careerhub-identity-token-change-in-production
      - CAREERHUB_APPLICATION_API_TOKEN=dev-careerhub-application-token-change-in-production
      - CAREERHUB_VERIFICATION_API_TOKEN=dev-careerhub-verification-token-change-in-production
      - CAREERHUB_INTERVIEW_API_TOKEN=dev-careerhub-interview-token-change-in-production
      - CAREERHUB_ARRANGEMENT_API_TOKEN=dev-careerhub-arrangement-token-change-in-production
      - CAREERHUB_PRIVATE_MEDIA_ROOT=/app/careerhub-private-media
      - CAREERHUB_DB_HOST=careerhub_db
      - CAREERHUB_DB_PORT=5432
      - CAREERHUB_DB_NAME=careerhub_db
      - CAREERHUB_DB_USER=careerhub_user
      - CAREERHUB_DB_PASSWORD=careerhub_pass
      - CAREERHUB_REDIS_HOST=careerhub_redis
      - CAREERHUB_REDIS_PORT=6379
      - CAREERHUB_REDIS_DB=0
      - CAREERHUB_REDIS_PASSWORD=careerhub_pass
      # Development mail is captured in-process and can never leave the stack.
      - CAREERHUB_EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
      - CAREERHUB_SECURE_SSL_REDIRECT=0
    depends_on:
      web:
        condition: service_healthy
      careerhub_db:
        condition: service_healthy
      careerhub_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # Private employee/intern portal. It shares Horilla's HR database but mounts
  # only the restricted PeopleHub URLconf; native HR administration is absent.
  peoplehub:
    build: .
    entrypoint: []
    command: gunicorn horilla.peoplehub_wsgi:application --config docker/gunicorn.conf.py
    ports:
      - "8002:8000"
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles:ro
      - reporting_private_media:/app/reporting-private-media
      - offboarding_private_media:/app/offboarding-private-media
    environment:
      - DEBUG=1
      - HORILLA_ENV=development
      - DB_HOST=db
      - AXES_PROXY_COUNT=1
      - SECRET_KEY=dev-secret-key-change-in-production
      - PEOPLEHUB_ALLOWED_HOSTS=localhost,127.0.0.1,people.thevipgroup.eu
      - PEOPLEHUB_CSRF_TRUSTED_ORIGINS=http://localhost:8002,http://127.0.0.1:8002,http://people.thevipgroup.eu
      - DATABASE_URL=postgres://horilla_user:horilla_pass@db:5432/horilla_db
      - DB_INIT_PASSWORD=dev-init-password-change-in-production
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
      - TVG_AUTOMATION_ENABLED=0
      - TVG_AUTOMATION_ENVIRONMENT=development
      - TVG_AUTOMATION_TRANSPORT_BACKEND=tvg_automation.transport.DisabledActivepiecesTransport
      - TVG_TRAINING_PROVIDER=disabled
      - TVG_RECRUITMENT_FROM_EMAIL=recruitment@thevipgroup.eu
      - TVG_RECRUITMENT_REPLY_TO=recruitment@thevipgroup.eu
      - TVG_LEGAL_EMPLOYER_ID=1
      - TVG_PEOPLEHUB_SSO_PROVIDER=disabled
      - TVG_PEOPLEHUB_AUTHENTIK_BACKEND=tvg_peoplehub.integrations.DisabledAuthentikProvider
      - TVG_REPORTING_PRIVATE_MEDIA_ROOT=/app/reporting-private-media
      - TVG_OFFBOARDING_PRIVATE_MEDIA_ROOT=/app/offboarding-private-media
      - TVG_REPORTING_AI_PROVIDER=disabled
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # Background jobs run here, NOT in the web workers. Keep this at exactly one
  # replica: the jobs are not idempotent, so a second copy means a second
  # payslip run and a second backup. Scaling `web` is safe; scaling this is not.
  scheduler:
    build: .
    command: python manage.py run_scheduler
    volumes:
      - .:/app
      - media:/app/media
      - reporting_private_media:/app/reporting-private-media
      - offboarding_private_media:/app/offboarding-private-media
    environment:
      - DEBUG=1
      - DB_HOST=db
      # nginx is the single proxy hop; lets django-axes read the real client IP
      - AXES_PROXY_COUNT=1
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,web
      - DATABASE_URL=postgres://horilla_user:horilla_pass@db:5432/horilla_db
      - DB_INIT_PASSWORD=dev-init-password-change-in-production
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
      - TVG_AUTOMATION_ENABLED=0
      - TVG_AUTOMATION_ENVIRONMENT=development
      - TVG_AUTOMATION_TRANSPORT_BACKEND=tvg_automation.transport.DisabledActivepiecesTransport
      - TVG_TRAINING_PROVIDER=disabled
      - TVG_TRAINING_ACTIVEPIECES_BACKEND=tvg_training.integrations.DisabledTrainingProvider
      - TVG_ANALYTICS_EXPORT_PROVIDER=disabled
      - TVG_ANALYTICS_MIN_CELL_SIZE=5
      - TVG_RECRUITMENT_FROM_EMAIL=recruitment@thevipgroup.eu
      - TVG_RECRUITMENT_REPLY_TO=recruitment@thevipgroup.eu
      # web owns migrate/collectstatic; racing them from here can deadlock on
      # DDL and would wipe STATIC_ROOT while web is serving from it.
      - HORILLA_SKIP_RELEASE_TASKS=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image's HEALTHCHECK curls localhost:8000/health/, which only the web
    # service serves. This container runs run_scheduler and binds no port, so
    # the inherited check can never pass -- it reported "unhealthy" forever,
    # and orchestrators that gate on health would restart-loop it. The prod
    # overlay builds on this file, so disabling it here covers both stacks.
    healthcheck:
      disable: true
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horilla_db
      POSTGRES_USER: horilla_user
      POSTGRES_PASSWORD: horilla_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horilla_user -d horilla_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass horilla_pass
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "horilla_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # CareerHub credentials and rate-limit counters are physically separate
  # from PeopleOps/HR data. These services have no published host ports.
  careerhub_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careerhub_db
      POSTGRES_USER: careerhub_user
      POSTGRES_PASSWORD: careerhub_pass
    volumes:
      - careerhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerhub_user -d careerhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  careerhub_redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass careerhub_pass
    volumes:
      - careerhub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "careerhub_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # Static only — /media/ is proxied to Django (protected_media). Do not
      # mount the media volume here; an alias location would bypass auth.
      - staticfiles:/static:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      careerhub:
        condition: service_healthy
      peoplehub:
        condition: service_healthy
    profiles: ["production"]

volumes:
  staticfiles:
  media:
  postgres_data:
  redis_data:
  careerhub_postgres_data:
  careerhub_redis_data:
  careerhub_private_media:
  verification_private_media:
  acceptance_private_media:
  erasmus_document_private_media:
  onboarding_private_media:
  reporting_private_media:
  offboarding_private_media:
