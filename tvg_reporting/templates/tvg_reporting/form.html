{% extends "tvg_peoplehub/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ title }}</h1>
  <form method="post"{% if multipart %} enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save draft / feedback</button>
  </form>
</div>
{% endblock %}
