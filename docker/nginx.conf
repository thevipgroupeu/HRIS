events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security
    server_tokens off;

    # Token-bearing paths/referrers must not enter access logs.
    log_format privacy '$time_iso8601 method=$request_method status=$status '
                       'bytes=$body_bytes_sent duration=$request_time';
    access_log /var/log/nginx/access.log privacy;

    # Port 80 is ordinary HTTP and ignores caller-supplied proxy headers.
    # 8080 is ONLY for the trusted Cloudflare connector. The tunnel overlay
    # publishes it on host loopback, never on a public interface.
    map "$server_port:$http_x_forwarded_proto" $origin_scheme {
        default $scheme;
        "8080:https" https;
    }
    map "$server_port:$http_cf_connecting_ip" $origin_client_ip {
        default $remote_addr;
        ~^8080:([0-9a-fA-F:.]+)$ $1;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Defence in depth for credential stuffing. django-axes locks a given
    # (username, IP) pair after AXES_FAILURE_LIMIT failures, but every one of
    # those attempts still costs a request, a database lookup and a password
    # hash. This caps the rate before any of that happens.
    #
    # 10m holds roughly 160k addresses. burst=10 nodelay lets a genuine user
    # who fat-fingers their password a few times through without a delay, then
    # throttles anything sustained beyond that.
    limit_req_zone $origin_client_ip zone=horilla_login:10m rate=5r/m;
    limit_req_status 429;

    upstream django {
        server web:8000;
    }

    upstream careerhub {
        server careerhub:8000;
    }

    upstream peoplehub {
        server peoplehub:8000;
    }

    server {
        listen 80 default_server;
        listen 8080 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 80;
        listen 8080;
        server_name people.thevipgroup.eu localhost 127.0.0.1;
        client_max_body_size 50M;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /static/ {
            alias /static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # /media/ is intentionally NOT served directly by nginx. Every file under
        # it requires Django's own per-request checks -- authentication (or a
        # valid JWT) and the content-type gate that forces uploaded HTML/SVG/XML/JS
        # to download instead of rendering inline. Serving it here via `alias`
        # would bypass both checks entirely, regardless of what Django itself
        # enforces in base/views.py:protected_media(). Requests fall through to
        # the proxy below instead.

        # Credential endpoints only. Kept ahead of `location /` so the rate
        # limit applies; the proxy settings are duplicated because nginx does
        # not inherit them into a more specific location block.
        location ~ ^/(login|api/auth/login)/?$ {
            limit_req zone=horilla_login burst=10 nodelay;

            proxy_pass http://peoplehub;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $origin_client_ip;
            proxy_set_header X-Forwarded-For $origin_client_ip;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Operational metrics: job counts and failure rates. Django also
        # requires staff for this, but defence in depth -- `location /` would
        # otherwise proxy it straight through to the internet. Scrape it from
        # inside the network, against the web container directly.
        location /metrics/ {
            deny all;
        }

        # CareerHub calls this path directly over the private Docker network.
        # It must not be reachable through the public PeopleHub proxy.
        location /internal/careerhub/ {
            deny all;
        }

        location / {
            proxy_pass http://peoplehub;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $origin_client_ip;
            proxy_set_header X-Forwarded-For $origin_client_ip;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }

    server {
        listen 80;
        listen 8080;
        server_name career.thevipgroup.eu;
        # CareerHub accepts a single 5 MB PDF plus multipart form overhead.
        client_max_body_size 6M;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /static/ {
            alias /static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://careerhub;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $origin_client_ip;
            proxy_set_header X-Forwarded-For $origin_client_ip;
            proxy_set_header X-Forwarded-Proto $origin_scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
}
